[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["torchpp*"]

[project]
name = "TorchPP"
version = "0.1.0"
description = "Multivariate temporal point processes in PyTorch — paper reproduction code."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=4.8.3",
    "matplotlib>=3.10.7",
    "numpy<2.0",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "pytest>=9.0.2",
    "tensordict>=0.10.0",
    "torch>=2.3.0",
    "tqdm>=4.67.1",
    "wandb>=0.22.2",
]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
