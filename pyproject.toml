[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["torchpp*"]

[project]
name = "TorchPP"
version = "0.1.0"
description = "Multivariate temporal point processes in PyTorch."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Hendrik Mehrtens" },
    { name = "Oliver Stegle" },
    { name = "Florian Büttner" },
]
keywords = ["temporal point processes", "Hawkes processes", "neural TPP", "event sequences", "PyTorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "omegaconf>=2.3.0",
    "tensordict>=0.10.0",
    "torch>=2.5",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
wandb = ["wandb>=0.22.2"]
examples = ["matplotlib>=3.10.7", "jupyterlab>=4"]
data = ["datasets>=4.8.3"]
all = ["wandb>=0.22.2", "matplotlib>=3.10.7", "jupyterlab>=4", "datasets>=4.8.3"]

[project.urls]
Repository = "https://github.com/PMBio/torchPP"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]
