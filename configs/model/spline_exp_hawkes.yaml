# Spline-baseline + exponential-kernel Hawkes process.
# Most commonly used Hawkes variant; good balance of flexibility and speed.
model_type: spline_exp_hawkes
training_preset: classical   # training/classical.yaml (overridden by -c training/... and training.*=...)

arch:
  baseline:
    num_knots: 5
    T_factor: 1.25
