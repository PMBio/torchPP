# Inhibitive Hawkes — spline baseline + spline kernel. Clamping function applied to raw intensity sum.
# Inhibitive variant of spline_spline_kernel; both baseline and kernel are splines.
# Uses numerical cumulative-intensity integration.
model_type: inhibitive_spline_spline_kernel

arch:
  spline_K: 5
  spline_kernel_K: 4
  spline_T_factor: 1.25
  num_ci_integration_steps: 100
  inhibitive_clamping_fn: softplus
