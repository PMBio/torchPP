# Training defaults for neural TPPs (transformer, GRU and continuous-time LSTM encoders) and the
# MLP-kernel Hawkes models. Same schedule as `classical`, with a lower learning rate.
# Values follow the configuration used for the standard benchmarks.
# Model presets select this file via `training_preset: neural`.
training:
  num_steps: 40000
  learning_rate: 0.01
  weight_decay: 1.0e-4
  eval_freq: 250
  scheduler_type: linear_warmup_cosine
  scheduler_warmup_steps: 500
  scheduler_eta_min: 1.0e-4
  scheduler_step_size: 1   # unused by the cosine schedule
  scheduler_gamma: 1.0     # unused by the cosine schedule
  grad_clip: 1.0
  early_stopping_patience: 4
  early_stopping_min_delta: 0.001
