# Training config tuned for neural TPP models on EasyTPP benchmark datasets.
# Neural models need more steps and a lower eval frequency.
training:
  num_steps: 15000
  learning_rate: 0.001
  weight_decay: 1.0e-5
  eval_freq: 1000
  scheduler_type: step
  scheduler_step_size: 5000
  scheduler_gamma: 0.5
  grad_clip: 1.0
  early_stopping_patience: 6       # stop after 6 evals without improvement
  early_stopping_min_delta: 0.001
