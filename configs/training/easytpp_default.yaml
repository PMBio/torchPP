# Training config tuned for EasyTPP benchmark datasets.
# EasyTPP models typically need a lower LR and more steps than UKB models.
training:
  num_steps: 3000
  learning_rate: 0.001
  weight_decay: 1.0e-5
  eval_freq: 200
  scheduler_type: step
  scheduler_step_size: 1000
  scheduler_gamma: 0.5
  grad_clip: 1.0
  early_stopping_patience: 10      # stop after 10 evals without improvement
  early_stopping_min_delta: 0.001
