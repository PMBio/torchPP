# Long training run — 5000 steps with slower LR decay.
training:
  num_steps: 5000
  learning_rate: 1.0
  weight_decay: 0.0
  eval_freq: 250
  scheduler_type: step
  scheduler_step_size: 500
  scheduler_gamma: 0.5
  grad_clip: 1.0
  early_stopping_patience: 3    # 0 = disabled; set e.g. 10 to stop after 10 evals without improvement
  early_stopping_min_delta: 0.001
