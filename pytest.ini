[pytest]
# Pytest configuration for TPP model tests.

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Make tests/helpers.py (and conftest constants) importable from any subdir.
pythonpath = tests

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --import-mode=importlib
    -ra

# Layer / property markers (applied per directory and per test).
markers =
    unit: module-level tests (instantiate directly, CPU-stable)
    contract: base-class API/relation contracts over the archetype set
    models: per-family numerical (CI-value) correctness over the model matrix
    integration: full-train / equivalence (kept out of the default run)
    numerical: uses numerical integration/differentiation
    slow: slow tests (deselect with -m "not slow")
    gpu: requires CUDA (device-specific behaviour)
    equivalence: EasyTPP equivalence harness

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

minversion = 8.0
console_output_style = progress
